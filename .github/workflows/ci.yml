name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (dist bundles + version.json)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      # Order-dependency net: the suite also runs with a fixed random seed so a
      # test that only passes because of file ordering fails here instead of in
      # someone else's checkout. --isolate already gives each file a fresh
      # global; this catches what isolation cannot (shared disk state, caches).
      - name: Tests (randomized order, seed 4242)
        run: bun test --isolate --randomize --seed=4242 --timeout=60000
