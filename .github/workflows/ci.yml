name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (dist bundles + version.json)
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      # Process-layer guard: spawn-bearing tools go through src/tools/spawn.ts
      # (the mockable seam over proc.ts). A direct Bun.spawn anywhere, or a raw
      # child_process import inside a tool, bypasses the seam and cannot be
      # stubbed per-tool. App-layer sync/stream utilities (git one-shots in
      # checkpoint/self-edit, ollama daemon start, stty) are intentionally
      # outside this guard — they are not tool call paths.
      - name: Process-layer guard (spawn only via the seam)
        run: |
          if grep -rn "Bun\.spawn" src --include="*.ts" --exclude="*.test.ts"; then
            echo "::error::Bun.spawn found — use src/tools/spawn.ts instead"
            exit 1
          fi
          if grep -rln '"node:child_process"' src/tools --include="*.ts" --exclude="*.test.ts" \
              | grep -v "^src/tools/proc.ts$" | grep -v "^src/tools/spawn.ts$"; then
            echo "::error::direct child_process import inside src/tools — use ./spawn"
            exit 1
          fi
          echo "process-layer guard OK"

      - name: Tests
        run: bun run test

      # Order-dependency net: the suite also runs with a fixed random seed so a
      # test that only passes because of file ordering fails here instead of in
      # someone else's checkout. --isolate already gives each file a fresh
      # global; this catches what isolation cannot (shared disk state, caches).
      - name: Tests (randomized order, seed 4242)
        run: bun test --isolate --randomize --seed=4242 --timeout=60000

      # dist/ is no longer committed, so the tarball IS the distribution: pack
      # it and install it into a clean project the way a user would. npm pack
      # runs `prepare` (build) first, so this also proves a from-scratch build
      # ships everything the bin needs.
      - name: Pack + install-from-tarball smoke
        run: |
          npm pack
          TARBALL=$(ls vibecoder-cli-*.tgz | head -1)
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/vibecoder --version
          ./node_modules/.bin/vibecoder --help | grep -q "Usage:"
          echo "tarball smoke OK ($TARBALL)"
